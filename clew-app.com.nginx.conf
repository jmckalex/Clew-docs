# /etc/nginx/sites-available/clew-app.com
#
# The Clew website and manual — a static tree rsynced here by `make sync`
# from ~/Source/Clew/Clew-docs.
#
#   /              landing page
#   /manual/       the manual (28 pages, self-contained, its own images/)
#   /downloads/    release binaries, uploaded separately by `make sync-downloads`
#
# clew-app.com is canonical; clew-app.net redirects to it. Both were
# registered for the app, and the redirect is what stops them becoming two
# separately-indexed copies of the same site.
#
# Port 80 only here; certbot rewrites this file in place to add the 443
# blocks and the http -> https redirects. Give it all four names at once
# (see README) so the .net redirect can be reached over https as well — a
# browser in HTTPS-first mode tries https://clew-app.net before it will try
# http, and an alternate domain with no certificate fails there rather than
# redirecting.
#
# NOTE ON add_header: nginx does not merge add_header across levels. A
# location containing even one add_header of its own discards every
# add_header inherited from the server block. That is why the cache policy
# below is expressed with `expires` wherever possible — `expires` sets
# Cache-Control without touching the add_header set, so the security headers
# at the bottom keep applying. The one location that does need add_header
# repeats them verbatim.

# clew-app.net (with www) -> clew-app.com
server {
    listen 80;
    listen [::]:80;

    server_name clew-app.net www.clew-app.net;

    return 301 https://clew-app.com$request_uri;
}

# Canonical site
server {
    listen 80;
    listen [::]:80;

    server_name clew-app.com www.clew-app.com;

    root /var/www/clew-app.com;
    index index.html;

    access_log /var/log/nginx/clew-app.com.access.log;
    error_log  /var/log/nginx/clew-app.com.error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # The manual is versioned with the app, not with a cache-busting hash in
    # its filenames, so a corrected page or a re-captured screenshot has no
    # new URL to announce itself with. Anything cached hard is cached wrong
    # the moment the docs are fixed.
    #
    # HTML: always revalidate. `expires -1` emits Cache-Control: no-cache.
    location ~* \.html$ {
        expires -1;
    }

    # Images and stylesheets: cached for a week, but NOT `immutable` — the
    # other sites on this droplet serve versioned assets and can say
    # immutable honestly; a manual screenshot keeps its filename when it is
    # replaced, and a reader who has seen the old one should not be stuck
    # with it for a month.
    location ~* \.(?:css|js|woff2?|ttf|otf|eot|svg|png|jpg|jpeg|gif|webp|ico)$ {
        expires 7d;
        access_log off;
    }

    # Release binaries: 115-245 MB each. These genuinely are immutable — the
    # version is in the filename, so a given URL never changes content.
    #
    # default_type is set explicitly because .AppImage and .dmg are not in
    # nginx's mime.types; without it they inherit whatever default_type the
    # http block carries, and a 150 MB installer served as text/plain is a
    # browser rendering binary garbage instead of offering to save it.
    location /downloads/ {
        default_type application/octet-stream;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        # Repeated because the add_header above drops the inherited set.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
